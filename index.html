<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODU CPS Aerospace Telemetry Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f30;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --success: #4ade80;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .status-badge {
            background-color: var(--success);
            color: #000;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #233554;
            border-radius: 8px;
            padding: 20px;
        }
        canvas {
            background-color: #05070c;
            border: 1px dashed var(--accent-color);
            width: 100%;
            height: 400px;
            display: block;
        }
        .metric {
            margin: 20px 0;
            font-size: 1.5rem;
        }
        .label { color: #94a3b8; }
        .value { color: var(--accent-color); font-weight: bold; font-size: 2rem;}
        .unit { color: #64748b; font-size: 1rem; }
    </style>
</head>
<body>
    <header>
        <h1>ODU CYBER-PHYSICAL SYSTEMS TELEMETRY STREAM</h1>
        <div id="connection-status" class="status-badge">CONNECTED (LIVE)</div>
    </header>

    <main class="dashboard-grid">
        <section class="card visualizer-card">
            <h2>Live 2D Flight Kinematics</h2>
            <canvas id="droneCanvas" width="400" height="400"></canvas>
        </section>

        <section class="card metrics-card">
            <h2>System State Indicators</h2>
            <div class="metric">
                <span class="label">Altitude:</span>
                <span id="alt-readout" class="value">0.00</span> <span class="unit">m</span>
            </div>
            <div class="metric">
                <span class="label">Velocity:</span>
                <span id="vel-readout" class="value">0.00</span> <span class="unit">m/s</span>
            </div>
            <div class="metric">
                <span class="label">Target Altitude:</span>
                <span class="value">50.00</span> <span class="unit">m</span>
            </div>
        </section>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('droneCanvas');
            const ctx = canvas.getContext('2d');
            const altReadout = document.getElementById('alt-readout');
            const velReadout = document.getElementById('vel-readout');

            let altitude = 0.0;
            let velocity = 0.0;
            const targetAltitude = 50.0;
            const timeStep = 0.05;

            function runTelemetryLoop() {
                let error = targetAltitude - altitude;
                let thrust = error * 0.5;
                let gravity = -9.81;
                let acceleration = thrust + gravity;

                velocity += acceleration * timeStep;
                altitude += velocity * timeStep;

                if (altitude < 0.0) {
                    altitude = 0.0;
                    velocity = 0.0;
                }

                altReadout.textContent = altitude.toFixed(2);
                velReadout.textContent = velocity.toFixed(2);

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                let droneY = canvas.height - 40 - (altitude * 5); 

                // Draw Ground
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height - 40);
                ctx.lineTo(canvas.width, canvas.height - 40);
                ctx.stroke();

                // Draw Target Line
                let targetY = canvas.height - 40 - (targetAltitude * 5);
                ctx.strokeStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(0, targetY);
                ctx.lineTo(canvas.width, targetY);
                ctx.stroke();

                // Draw Quadcopter
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(canvas.width / 2 - 20, droneY, 40, 10);
                ctx.fillRect(canvas.width / 2 - 40, droneY - 5, 20, 5);
                ctx.fillRect(canvas.width / 2 + 20, droneY - 5, 20, 5);

                setTimeout(runTelemetryLoop, timeStep * 1000);
            }

            runTelemetryLoop();
        });
    </script>
</body>
</html>
